name = "studyos"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# SPA + API on one Worker. /api/* always hits the Worker first.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Create the bucket once: `bunx wrangler r2 bucket create studyos-documents`
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "studyos-documents"
preview_bucket_name = "studyos-documents"

# Non-secret config (override per env in dashboard if needed).
# Must match VITE_FIREBASE_PROJECT_ID used by the SPA.
[vars]
FIREBASE_PROJECT_ID = "studyos-49701"

# Secrets (set via CLI, never commit):
#   bunx wrangler secret put OPENROUTER_API_KEY
# Optional CORS for cross-origin SPA (comma-separated). Same-origin deploy usually empty.
#   bunx wrangler secret put CORS_ORIGINS   # e.g. http://localhost:5173

# Local secrets: copy .dev.vars.example → .dev.vars
